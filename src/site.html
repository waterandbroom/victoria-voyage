<style>
/* Layout: lime-washed medina wall, indigo ink, horseshoe-arch frames as the one recurring motif. */
:root{
  --bg:#F5F3EE;          /* lime plaster */
  --surface:#ECE8DF;     /* shaded plaster */
  --ink:#17213F;         /* Tuareg indigo */
  --muted:#5C6178;
  --line:#D6D1C4;
  --accent:#2C4296;      /* Majorelle, deepened */
  --saffron:#C98A1E;
  --on-accent:#F5F3EE;
  --display:"Bodoni Moda", "Didot", Georgia, serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius:14px;
  --wrap:1180px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1330;--surface:#161C3F;--ink:#ECE7DC;--muted:#A3A7BD;--line:#2A3159;
  --accent:#8EA2F0;--saffron:#E2B04F;--on-accent:#0E1330;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1330;--surface:#161C3F;--ink:#ECE7DC;--muted:#A3A7BD;--line:#2A3159;
  --accent:#8EA2F0;--saffron:#E2B04F;--on-accent:#0E1330;color-scheme:dark}
html[lang="ar"]{
  --display:"Reem Kufi", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --body:"IBM Plex Sans Arabic", Tahoma, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.08;text-wrap:balance;margin:0}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.35}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
html[lang="ar"] .eyebrow{font-family:var(--body);letter-spacing:0;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:zoom-in}
.brand > span{display:flex;flex-direction:column;align-items:center;direction:ltr}
.brand .w1,.brand .w2{padding-left:.2em}
.brand .w2{padding-left:.42em}
.brand svg{width:48px;height:37px;color:var(--ink);flex:none}
.brand .w1{font-family:"Bodoni Moda",Georgia,serif;font-size:19px;letter-spacing:.2em;line-height:1;display:block}
.brand .w2{font-family:"Bodoni Moda",Georgia,serif;font-size:16px;letter-spacing:.42em;color:var(--muted);margin-top:4px;display:block;line-height:1}
nav.links{display:flex;gap:28px;font-size:14px}
nav.links a{text-decoration:none;color:var(--muted)}
nav.links a:hover{color:var(--ink)}
.right{display:flex;align-items:center;gap:14px}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:none;color:var(--muted);font:500 12px/1 var(--mono);padding:7px 10px;border-radius:999px;cursor:pointer;letter-spacing:.06em}
.langs button[data-l="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:13px;letter-spacing:0}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 14px/1 var(--body);padding:14px 22px;border-radius:999px;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .2s ease,background .2s ease}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:transparent}
.btn-ghost:hover{border-color:var(--ink)}
.top .btn{padding:11px 18px}
@media (max-width:900px){nav.links{display:none}}
@media (max-width:520px){.top .btn{display:none}.brand .w1{font-size:16px}.brand .w2{font-size:13.5px}}

/* Hero */
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:end;padding-block:64px 72px}
.hero h1{font-size:clamp(44px,6.4vw,88px);letter-spacing:-.015em}
.hero h1 em{font-style:italic;color:var(--accent)}
html[lang="ar"] .hero h1{font-size:clamp(38px,5.2vw,70px)}
html[lang="ar"] .hero h1 em{font-style:normal}
.hero .lede{font-size:18px;color:var(--muted);max-width:46ch;margin-top:24px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero .facts{display:flex;flex-wrap:wrap;gap:28px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
.hero .facts b{display:block;font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1}
.hero .facts span{font-size:13px;color:var(--muted)}
.arch{border-radius:999px 999px var(--radius) var(--radius);overflow:hidden;background:var(--surface);position:relative}
.arch img{display:block;width:100%;height:100%;object-fit:cover}
.hero .arch{aspect-ratio:4/5;max-height:620px;max-width:100%}
.hero figure{margin:0;position:relative}
.hero figcaption{position:absolute;inset-inline-start:-18px;bottom:36px;background:var(--bg);border:1px solid var(--line);padding:12px 16px;border-radius:10px;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--muted)}
.hero figcaption b{color:var(--ink);font-weight:500}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:36px;padding-block:36px 48px}.hero .arch{aspect-ratio:1/1;max-height:440px}.hero figcaption{inset-inline-start:12px}}

/* Sections */
section.block{padding-block:88px;border-top:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.head h2{font-size:clamp(32px,4vw,52px);margin-top:12px}
.head p{color:var(--muted);max-width:44ch}
@media (max-width:600px){section.block{padding-block:56px}}

/* Cities */
.cities{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 24px}
.city{display:flex;flex-direction:column;gap:14px;min-width:0}
.city .arch{aspect-ratio:3/4;max-width:100%}
.city .arch img{transition:transform .8s ease}
.city:hover .arch img{transform:scale(1.04)}
.city h3{font-size:26px}
.city p{color:var(--muted);font-size:14.5px}
.city .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
.city .meta span:last-child{color:var(--saffron)}
@media (max-width:980px){.cities{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.cities{gap:28px 14px}.city h3{font-size:21px}.city p{font-size:13.5px}.city .meta{flex-direction:column}}

/* Trips */
.trips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.trip{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.trip .arch{aspect-ratio:3/4;max-width:100%}
.trip .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.trip .days{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--saffron);text-transform:uppercase}
.trip h3{font-size:26px}
.trip .route{font-size:14px;color:var(--muted)}
.trip .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.trip .price small{display:block;font-size:12px;color:var(--muted)}
.trip .price b{font-family:var(--display);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.trip .foot button{background:none;border:0;padding:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.note{margin-top:20px;font-size:13px;color:var(--muted)}
@media (max-width:980px){.trips{grid-template-columns:1fr}}
@media (max-width:520px){.trip{grid-template-columns:110px minmax(0,1fr);gap:16px;padding:14px}.trip h3{font-size:21px}}

/* Why */
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.why div{display:flex;flex-direction:column;gap:10px}
.why svg{width:30px;height:30px;color:var(--accent)}
.why h3{font-size:21px}
.why p{color:var(--muted);font-size:14.5px}
@media (max-width:900px){.why{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.why{grid-template-columns:1fr}}

/* Planner */
.planner-sec{background:var(--surface)}
.planner{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.planner .intro h2{font-size:clamp(32px,4vw,52px);margin-top:12px}
.planner .intro p{color:var(--muted);margin-top:18px;max-width:40ch}
.contact-lines{margin-top:32px;display:flex;flex-direction:column;gap:12px}
.contact-lines div{display:flex;flex-direction:column;gap:2px}
.contact-lines small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.contact-lines a,.contact-lines span{font-size:18px;text-decoration:none;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
@media (max-width:900px){.planner{grid-template-columns:1fr;gap:36px}}

form.card{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:32px;min-width:0}
@media (max-width:520px){form.card{padding:20px}}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:28px;list-style:none;padding:0}
.steps li{font-size:12.5px;color:var(--muted);padding-top:10px;border-top:2px solid var(--line)}
.steps li span{font-family:var(--mono);margin-inline-end:6px}
.steps li.on{color:var(--ink);border-color:var(--accent)}
.steps li.done{border-color:var(--ink)}
@media (max-width:520px){.steps li{font-size:0}.steps li span{font-size:12px}}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:22px}
legend{font-family:var(--display);font-size:28px;margin-bottom:6px;padding:0}
.q{display:flex;flex-direction:column;gap:10px}
.q > label,.q > .lbl{font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-block;padding:9px 15px;border:1px solid var(--line);border-radius:999px;font-size:14px;transition:background .15s,border-color .15s}
.chip input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.chip:hover span{border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;width:max-content}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:20px;color:var(--ink);cursor:pointer}
.stepper output{min-width:36px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.nav-row{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}
.err{color:#B3261E;font-size:13px}
:root[data-theme="dark"] .err{color:#FFB4AB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FFB4AB}}
.summary{border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:14px;display:grid;gap:6px}
.summary div{display:flex;gap:10px}
.summary dt{color:var(--muted);min-width:110px;margin:0}
.summary dd{margin:0}
.send{display:flex;flex-wrap:wrap;gap:10px}
.btn-wa{background:#1F8F55;color:#fff}
.status{font-size:14px;padding:12px 14px;border-radius:10px;background:var(--surface)}
.hp{position:absolute;left:-9999px}

/* Footer */
footer{padding-block:48px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
footer p{color:var(--muted);font-size:13px}
.wa-float{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:calc(20px + env(safe-area-inset-right,0px));width:56px;height:56px;border-radius:50%;background:#1F8F55;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30}
.wa-float svg{width:28px;height:28px}

dialog#logoBox{border:0;border-radius:20px;padding:56px 48px 48px;background:var(--bg);color:var(--ink);max-width:min(92vw,560px);width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog#logoBox::backdrop{background:rgba(14,19,48,.72);backdrop-filter:blur(4px)}
dialog#logoBox[open]{animation:pop .28s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.big-logo{display:flex;flex-direction:column;align-items:center;gap:6px;direction:ltr}
.big-logo svg{width:min(60vw,300px);height:auto;aspect-ratio:100/78;color:var(--ink);margin-bottom:22px}
.bw1{font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(30px,7vw,46px);letter-spacing:.22em;padding-left:.22em;line-height:1}
.bw2{display:flex;align-items:center;gap:16px;font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(15px,3.4vw,21px);letter-spacing:.5em;padding-left:.5em;color:var(--muted);margin-top:8px}
.bw2 i{display:block;width:clamp(28px,8vw,56px);height:1px;background:var(--saffron)}
.bw2 i:last-child{margin-left:-.5em}
dialog#logoBox .close{position:absolute;top:12px;right:14px;width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:28px;cursor:pointer;line-height:1}
</style>
<!--/head-->

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="6 2 100 78">

    <path d="M14 74.5V10H46M14 43H52M97.9 26.3A26 26 0 1 0 97.9 59.7" fill="none" stroke="var(--saffron)" stroke-width="1.6" stroke-dasharray="4 3.5"/>

<header class="top">
  <div class="wrap">
    <button type="button" class="brand" data-logo aria-label="Victoria Voyage — logo" aria-haspopup="dialog">
      <svg><use href="#mark"/></svg>
      <span><span class="w1">VICTORIA</span><span class="w2">VOYAGE</span></span>
    </button>
    <nav class="links">
      <a href="#destinations" data-i18n="nav.dest"></a>
      <a href="#voyages" data-i18n="nav.trips"></a>
      <a href="#pourquoi" data-i18n="nav.why"></a>
      <a href="#planifier" data-i18n="nav.contact"></a>
    </nav>
    <div class="right">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-l="ar" lang="ar">ع</button>
        <button type="button" data-l="fr">FR</button>
        <button type="button" data-l="en">EN</button>
      </div>
      <a class="btn btn-primary" href="#planifier" data-i18n="cta.plan"></a>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 style="margin-top:18px" data-i18n-html="hero.title"></h1>
        <p class="lede" data-i18n="hero.lede"></p>
        <div class="ctas">
          <a class="btn btn-primary" href="#planifier" data-i18n="cta.plan"></a>
          <a class="btn btn-ghost" href="#destinations" data-i18n="cta.explore"></a>
        </div>
        <div class="facts">
          <div><b>8</b><span data-i18n="facts.cities"></span></div>
          <div><b>3</b><span data-i18n="facts.langs"></span></div>
          <div><b>24 h</b><span data-i18n="facts.reply"></span></div>
        </div>
      </div>
      <figure>
        <div class="arch"><img src="https://images.unsplash.com/photo-1597212618440-806262de4f6b?auto=format&fit=crop&w=1100&q=70" alt="" data-i18n-alt="hero.alt"></div>
        <figcaption><b>Koutoubia, Marrakech</b><br>31.62° N · 7.99° W</figcaption>
      </figure>
    </div>
  </section>

  <section class="block" id="destinations">
    <div class="wrap">
      <div class="head">
        <div><p class="eyebrow" data-i18n="dest.eyebrow"></p><h2 data-i18n="dest.title"></h2></div>
        <p data-i18n="dest.lede"></p>
      </div>
      <div class="cities" id="cities"></div>
    </div>
  </section>

  <section class="block" id="voyages">
    <div class="wrap">
      <div class="head">
        <div><p class="eyebrow" data-i18n="trips.eyebrow"></p><h2 data-i18n="trips.title"></h2></div>
        <p data-i18n="trips.lede"></p>
      </div>
      <div class="trips" id="trips"></div>
      <p class="note" data-i18n="trips.note"></p>
    </div>
  </section>

  <section class="block" id="pourquoi">
    <div class="wrap">
      <div class="head">
        <div><p class="eyebrow" data-i18n="why.eyebrow"></p><h2 data-i18n="why.title"></h2></div>
      </div>
      <div class="why">
        <div>
          <svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 26V13a11 11 0 0 1 22 0v13"/><path d="M4 26h22"/><path d="M10 26v-8a5 5 0 0 1 10 0v8"/></svg>
          <h3 data-i18n="why.1t"></h3><p data-i18n="why.1p"></p>
        </div>

let lang = "fr";
try{ const s = localStorage.getItem("vv-lang"); if(s && T[s]) lang = s; else { const n=(navigator.language||"").slice(0,2); if(T[n]) lang=n; } }catch(e){}
const t = k => T[lang][k] ?? T.fr[k] ?? k;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function chip(group, value, label, type="checkbox", checked=false){
  return `<label class="chip"><input type="${type}" name="${group}" value="${value}" ${checked?"checked":""}><span>${label}</span></label>`;
}
function renderChips(){
  const keep = name => new Set($$(`input[name="${name}"]:checked`).map(i=>i.value));
  const c = keep("cities"), f = keep("flex"), b = keep("budget"), s = keep("stay"), it = keep("interests");
  $("#cityChips").innerHTML = CITIES.map(x=>chip("cities",x.k,x.n[lang],"checkbox",c.has(x.k))).join("") + chip("cities","advise",t("f1.advise"),"checkbox",c.has("advise"));
  $("#flexChips").innerHTML = Object.entries(OPT.flex).map(([k,v])=>chip("flex",k,v[lang],"radio",f.size?f.has(k):k==="yes")).join("");
  $("#budgetChips").innerHTML = Object.entries(OPT.budget).map(([k,v])=>chip("budget",k,v[lang],"radio",b.size?b.has(k):k==="mid")).join("");
  $("#stayChips").innerHTML = Object.entries(OPT.stay).map(([k,v])=>chip("stay",k,v[lang],"radio",s.size?s.has(k):k==="riad")).join("");
  $("#intChips").innerHTML = Object.entries(OPT.int).map(([k,v])=>chip("interests",k,v[lang],"checkbox",it.has(k))).join("");
}
function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  $$("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  $$("[data-i18n-html]").forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml); });
  $$("[data-i18n-alt]").forEach(el=>{ el.alt = t(el.dataset.i18nAlt); });
  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===lang));
  $("#cities").innerHTML = CITIES.map(c=>`
    <article class="city">
      <div class="arch"><img loading="lazy" src="${IMG(c.img)}" alt="${c.n[lang]}"></div>
      <h3>${c.n[lang]}</h3>
      <p>${c.d[lang]}</p>
      <div class="meta"><span dir="ltr">${c.geo}</span><span>${c.s[lang]}</span></div>
    </article>`).join("");
  $("#trips").innerHTML = TRIPS.map(x=>`
    <article class="trip">
      <div class="arch"><img loading="lazy" src="${IMG(x.img)}" alt=""></div>
      <div class="body">
        <span class="days">${x.days} ${t("trip.days")}</span>
        <h3>${x.n[lang]}</h3>
        <p class="route">${x.r[lang]}</p>
        <div class="foot">
          <div class="price"><small>${t("trip.from")}</small><b dir="ltr">${x.price} MAD</b></div>
          <button type="button" data-trip="${x.k}">${t("trip.ask")}</button>
        </div>
      </div>
    </article>`).join("");
  renderChips();
  updateSummary();
}

/* language switch */
$$(".langs button").forEach(b=>b.addEventListener("click",()=>{
  lang = b.dataset.l; try{localStorage.setItem("vv-lang",lang)}catch(e){}
  render();
}));

/* trip shortcuts */
const TRIP_CITIES = {imperial:["casablanca","fes","marrakech"],sahara:["marrakech","aitbenhaddou","merzouga"],north:["tanger","chefchaouen"],coast:["casablanca","essaouira"]};
let chosenTrip = null;
document.addEventListener("click",e=>{
  const b = e.target.closest("[data-trip]"); if(!b) return;
  chosenTrip = b.dataset.trip;
  const set = new Set(TRIP_CITIES[chosenTrip]);
  $$('input[name="cities"]').forEach(i=>i.checked=set.has(i.value));
  const tr = TRIPS.find(x=>x.k===chosenTrip);
  $("#duration").value = tr.days<=4 ? "d1" : tr.days<=7 ? "d2" : "d3";
  go(1); $("#planifier").scrollIntoView({behavior:"smooth"});
});

/* steppers */
$$(".stepper").forEach(s=>s.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  const o = s.querySelector("output"); const min = s.dataset.field==="adults"?1:0;
  o.value = o.textContent = Math.max(min, Math.min(20, (+o.textContent) + (+b.dataset.d)));
  updateSummary();
}));

/* steps */
let step = 1;
function go(n){
  step = n;
  $$("fieldset[data-step]").forEach(f=>f.hidden = +f.dataset.step!==step);
  $$("#steps li").forEach((li,i)=>{ li.className = i+1===step?"on":(i+1<step?"done":""); });
  $("#prev").hidden = step===1;
  $("#next").hidden = step===4;
  if(step===4) updateSummary();
}
function vals(name){ return $$(`input[name="${name}"]:checked`).map(i=>i.value); }
$("#next").addEventListener("click",()=>{
  if(step===1 && !vals("cities").length){ $("#err1").hidden=false; return; }
  $("#err1").hidden = true;
  go(step+1);
  $("#planner").scrollIntoView({behavior:"smooth",block:"start"});
});
$("#prev").addEventListener("click",()=>go(step-1));
$("#planner").addEventListener("change",updateSummary);
$("#planner").addEventListener("input",updateSummary);

function data(){
  const cityName = k => k==="advise" ? t("f1.advise") : (CITIES.find(c=>c.k===k)||{n:{}}).n[lang];
  const date = $("#arrival").value;
  const dur = $("#duration").selectedOptions[0]?.textContent || "";
  const flex = vals("flex")[0];
  return {
    cities: vals("cities").map(cityName).join(", ") || t("sum.none"),
    when: (date ? new Date(date+"T12:00").toLocaleDateString(lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"long",year:"numeric"}) : t("sum.none")) + (flex ? ` (${OPT.flex[flex][lang]})` : ""),
    dur,
    people: T[lang].ppl(+$("#adults").textContent, +$("#kids").textContent),
    budget: (OPT.budget[vals("budget")[0]]||{})[lang] || t("sum.none"),
    stay: (OPT.stay[vals("stay")[0]]||{})[lang] || t("sum.none"),
    int: vals("interests").map(k=>OPT.int[k][lang]).join(", ") || t("sum.none"),
    trip: chosenTrip ? TRIPS.find(x=>x.k===chosenTrip).n[lang] : "",
    name: $("#fname").value.trim(), country: $("#country").value.trim(),
    phone: $("#phone").value.trim(), email: $("#email").value.trim(), msg: $("#msg").value.trim()
  };
}
function lines(d){
  const L = [
    [t("sum.cities"),d.cities],[t("sum.when"),d.when],[t("sum.dur"),d.dur],[t("sum.people"),d.people],
    [t("sum.budget"),d.budget],[t("sum.stay"),d.stay],[t("sum.int"),d.int]];
  if(d.trip) L.unshift([t("nav.trips"),d.trip]);
  return L;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function updateSummary(){
  if(!$("#summary")) return;
  const d = data();
  $("#summary").innerHTML = lines(d).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
  const msg = [t("wa.hello"), "", ...lines(d).map(([k,v])=>`• ${k} : ${v}`), "",
    d.name && `${t("f4.name")} : ${d.name}`, d.country && `${t("f4.country")} : ${d.country}`,
    d.phone && `${t("f4.phone")} : ${d.phone}`, d.email && `${t("f4.email")} : ${d.email}`, d.msg && `\n${d.msg}`].filter(Boolean).join("\n");
  $("#sendWa").href = `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
}
function contactOk(){
  const d = data(); const ok = d.name && (d.phone || d.email);
  $("#err4").hidden = !!ok; return ok;
}
$("#sendWa").addEventListener("click",e=>{ if(!contactOk()) e.preventDefault(); });

$("#planner").addEventListener("submit",async e=>{
  e.preventDefault();
  if(step!==4){ $("#next").click(); return; }
  if(!contactOk() || $("#hp").value) return;
  const st = $("#status"); st.hidden=false; st.textContent = t("st.sending");
  const d = data();
  const payload = {_subject:`Victoria Voyage — ${d.name}`, _template:"table", _captcha:"false"};
  lines(d).forEach(([k,v])=>payload[k]=v);
  Object.assign(payload,{[t("f4.name")]:d.name,[t("f4.country")]:d.country,[t("f4.phone")]:d.phone,[t("f4.email")]:d.email,Message:d.msg,Langue:lang});
  if(d.email) payload._replyto = d.email;
  try{
    const r = await fetch(`https://formsubmit.co/ajax/${EMAIL}`,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(payload)});
    if(!r.ok) throw 0;
    st.textContent = t("st.ok");
  }catch(err){ st.textContent = t("st.fail"); }
});


const box = document.getElementById("logoBox");
document.querySelectorAll("[data-logo]").forEach(b=>b.addEventListener("click",()=>{ try{ box.showModal(); }catch(e){ box.setAttribute("open",""); } }));
box.querySelector(".close").addEventListener("click",()=>box.close());
box.addEventListener("click",e=>{ if(e.target===box) box.close(); });
$("#yr").textContent = new Date().getFullYear();
render(); go(1);
})();
</script>
